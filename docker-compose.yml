# Local stand-ins for Azure and KeyStone. Passwords come from .env, which
# `./build.ps1 up` generates with random values (never committed).
name: adf-to-dotnet

services:
  db2:
    image: icr.io/db2_community/db2:12.1.0.0
    container_name: keystone-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?run ./build.ps1 up to generate .env}
      DBNAME: KEYSTONE
      UPDATEAVAIL: "NO"
      # Password of the read-only extract login, used by /var/custom/create_extract_user.sh.
      KS_EXTRACT_PASSWORD: ${DB2_EXTRACT_PASSWORD:?run ./build.ps1 up to generate .env}
    ports:
      - "50000:50000"
    volumes:
      - ./db/keystone-db2/custom:/var/custom:ro
    # No persistent volume: the instance directory under /database cannot be re-initialised by a
    # recreated container (db2icrt fails). Data is synthetic and re-seeded by script.
    healthcheck:
      test: ["CMD-SHELL", "id ksextract >/dev/null 2>&1 && su - db2inst1 -c 'db2 connect to KEYSTONE' | grep -q 'Database Connection Information'"]
      interval: 15s
      timeout: 30s
      retries: 40
      start_period: 180s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: reporting-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?run ./build.ps1 up to generate .env}
    ports:
      - "14330:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001 && nc -z 127.0.0.1 10002"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stands in for KeyBridge and the alert webhook; mappings live in contracts/keybridge/mappings.
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: wiremock
    command: ["--global-response-templating"]
    ports:
      - "8081:8080"
    volumes:
      - ./contracts/keybridge:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The image has no shell, so build.ps1 probes its port instead of a container healthcheck.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: aspire-dashboard
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  sql-data:
  azurite-data:
